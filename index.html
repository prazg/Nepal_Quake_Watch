<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nepal Quake Watch — earthquakes, shaking and exposure</title>
<meta name="description" content="Earthquake monitoring for Nepal: USGS and NEMRC catalogues, USGS ShakeMap shaking, estimated population exposure, health facilities and official emergency contacts.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip" href="#events">Skip to event list</a>

<header class="bar">
  <div class="brand">
    <span class="seis" aria-hidden="true">
      <svg viewBox="0 0 64 20" preserveAspectRatio="none"><polyline points="0,10 8,10 12,4 16,16 20,7 24,12 28,10 36,10 40,2 44,18 48,6 52,11 56,10 64,10"/></svg>
    </span>
    <h1>Nepal Quake Watch</h1>
  </div>
  <div class="bar-meta">
    <span id="freshness" class="stale">Loading…</span>
    <button id="btn-about" class="ghost" type="button" aria-expanded="false">About the data</button>
  </div>
</header>

<div class="warn" role="note">
  Situational awareness and planning only. This is not an alerting system and
  must not be relied on for warning. In an emergency call
  <a href="tel:100">100</a> or <a href="tel:112">112</a>.
</div>

<main class="shell">

  <section class="rail" aria-label="Earthquake list">
    <div class="rail-controls">
      <div class="seg" role="group" aria-label="Catalogue">
        <button type="button" data-cat="usgs" class="on">USGS</button>
        <button type="button" data-cat="nemrc">NEMRC</button>
      </div>
      <label class="magf">
        Minimum magnitude
        <input type="range" id="magmin" min="2.5" max="7" step="0.1" value="2.5">
        <output id="magout">2.5</output>
      </label>
    </div>
    <p id="railnote" class="railnote"></p>
    <ol id="events" class="events" tabindex="-1"></ol>
  </section>

  <div id="map" role="application" aria-label="Map of earthquakes in Nepal"></div>

  <aside id="panel" class="panel" aria-live="polite" hidden></aside>

</main>

<div id="about" class="sheet" hidden>
  <div class="sheet-inner">
    <button class="close" id="about-close" type="button" aria-label="Close">Close</button>
    <h2>What this shows, and what it does not</h2>
    <div id="about-body"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
